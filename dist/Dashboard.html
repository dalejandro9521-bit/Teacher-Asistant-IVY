<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2933; --ink2: #52606d; --ink3: #7b8794; --line: #e4e7eb; --bg: #f5f7fa; --card: #ffffff;
    --brand: #1d3f72; --brand2: #2f5ea8; --brand-soft: #e8eef8;
    --p: #137333; --p-bg: #e6f4ea; --t: #a05a00; --t-bg: #fef3d6; --a: #c5221f; --a-bg: #fce8e6;
    --e: #1967d2; --e-bg: #e8f0fe; --warn: #b06000; --warn-bg: #fff4e5;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; color: var(--ink); background: var(--bg); }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

  /* sidebar */
  nav { background: var(--brand); color: #fff; display: flex; flex-direction: column; padding: 18px 12px; gap: 2px; overflow-y: auto; }
  .logo { font-weight: 700; font-size: 16px; padding: 4px 10px 2px; letter-spacing: .2px; }
  .logo-sub { font-size: 12px; opacity: .7; padding: 0 10px 16px; }
  .nav-h { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; opacity: .55; padding: 14px 10px 6px; }
  .nav-i { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: transparent; color: #fff;
    text-align: left; padding: 9px 10px; border-radius: 8px; opacity: .88; }
  .nav-i:hover { background: rgba(255,255,255,.08); opacity: 1; }
  .nav-i.on { background: rgba(255,255,255,.16); opacity: 1; font-weight: 600; }
  .nav-i small { display: block; font-size: 11px; opacity: .7; font-weight: 400; }
  .badge { min-width: 22px; height: 20px; padding: 0 7px; border-radius: 10px; background: #fff; color: var(--brand); font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; }
  .badge.alert { background: #ffb4a8; color: #5c1009; }
  .nav-foot { margin-top: auto; padding: 14px 10px 0; font-size: 12px; opacity: .6; }

  /* main */
  main { overflow-y: auto; padding: 26px 32px 60px; }
  .crumbs { font-size: 13px; color: var(--ink3); margin-bottom: 6px; }
  .crumbs a { color: var(--brand2); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--ink2); margin: 0 0 20px; }
  h2 { font-size: 15px; margin: 26px 0 10px; font-weight: 600; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 16px 18px; }
  .muted { color: var(--ink3); }
  .small { font-size: 12px; }

  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: #cbd2d9; background: #fafbfc; }
  .btn.primary { background: var(--brand2); border-color: var(--brand2); color: #fff; }
  .btn.primary:hover { background: var(--brand); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--brand2); padding: 6px 8px; }
  .btn.ghost:hover { background: var(--brand-soft); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .kpi { padding: 14px 18px; }
  .kpi .n { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .kpi .l { color: var(--ink2); font-size: 13px; }
  .kpi.alert .n { color: var(--a); }
  .kpi.warn .n { color: var(--warn); }
  .kpi.click { cursor: pointer; }
  .kpi.click:hover { border-color: #cbd2d9; }

  /* class cards */
  .classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .cls { padding: 16px 18px; cursor: pointer; transition: border-color .15s; }
  .cls:hover { border-color: var(--brand2); }
  .cls .code { font-size: 12px; font-weight: 600; color: var(--brand2); letter-spacing: .3px; }
  .cls .name { font-weight: 600; font-size: 15px; margin: 2px 0 4px; }
  .cls .when { color: var(--ink2); font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: #eef1f4; color: var(--ink2); white-space: nowrap; }
  .chip.zoom { background: var(--e-bg); color: var(--e); }
  .chip.room { background: #f0ebfa; color: #6b3fa0; }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--a-bg); color: var(--a); }
  .chip.good { background: var(--p-bg); color: var(--p); }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #eef1f4; margin: 12px 0 6px; }
  .bar span { display: block; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: 0; }

  /* status cells */
  .st { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 6px; font-weight: 700; font-size: 12px; }
  .st.P { background: var(--p-bg); color: var(--p); }
  .st.T { background: var(--t-bg); color: var(--t); }
  .st.A { background: var(--a-bg); color: var(--a); }
  .st.E { background: var(--e-bg); color: var(--e); }
  .st.none { color: #c3cad1; }
  .st .left { font-size: 10px; margin-left: 2px; }

  /* tables */
  .tbl-wrap { overflow: auto; max-height: calc(100vh - 260px); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th { position: sticky; top: 0; background: #f9fafb; z-index: 2; text-align: left; font-size: 12px; font-weight: 600; color: var(--ink2);
    padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid #f0f2f4; vertical-align: middle; }
  tr:hover td { background: #fafbfc; }
  td.num, th.num { text-align: center; }
  td.sticky, th.sticky { position: sticky; left: 0; background: #fff; z-index: 1; }
  th.sticky { z-index: 3; background: #f9fafb; }
  td.sticky2, th.sticky2 { position: sticky; left: 44px; background: #fff; z-index: 1; min-width: 210px; }
  th.sticky2 { z-index: 3; background: #f9fafb; }
  .wk { cursor: pointer; color: var(--brand2); }
  .wk:hover { text-decoration: underline; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  .search { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; width: 260px; background: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 7px 12px; color: var(--ink2); font-size: 13px; }
  .seg button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--line); }

  .sessions { display: flex; gap: 8px; flex-wrap: wrap; }
  .sess { padding: 10px 14px; cursor: pointer; min-width: 150px; }
  .sess:hover { border-color: var(--brand2); }
  .sess b { display: block; }

  /* session view */
  .two { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(420px, 1.15fr); gap: 16px; align-items: start; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { padding: 10px 16px; min-width: 110px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat.P .n { color: var(--p); } .stat.T .n { color: var(--t); } .stat.A .n { color: var(--a); }
  .startbox { display: flex; gap: 8px; align-items: center; }
  .startbox input { width: 110px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .note { color: var(--ink2); font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 14px; }
  .tabs button { border: 0; background: transparent; padding: 11px 12px; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--brand); border-bottom-color: var(--brand2); font-weight: 600; }
  .shot { border: 1px solid var(--line); border-radius: 8px; margin: 12px 14px; }
  .shot-h { padding: 8px 12px; background: #f9fafb; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; justify-content: space-between; }
  .line { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 6px 12px; border-bottom: 1px solid #f3f4f6; align-items: center; font-size: 13px; }
  .line:last-child { border-bottom: 0; }
  .line .ico { font-weight: 700; text-align: center; }
  .line.match .ico { color: var(--p); } .line.doubt .ico { color: var(--warn); } .line.unknown .ico { color: var(--a); } .line.ignored .ico, .line.noise .ico { color: var(--ink3); }
  .line.noise { color: var(--ink3); }
  .line .who { font-size: 12px; color: var(--ink2); text-align: right; }
  .line .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink3); margin-right: 6px; }

  /* questions & follow-ups */
  .q { padding: 16px 18px; margin-bottom: 12px; }
  .q .seen { font-size: 17px; font-weight: 600; }
  .q .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .q input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 220px; }
  .fu { padding: 16px 18px; margin-bottom: 12px; }
  .fu .who { background: var(--brand-soft); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .fu .who b { color: var(--brand); }
  .fu pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; background: #f9fafb; border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 220px; overflow: auto; margin: 8px 0 0; }
  .vis { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .empty { text-align: center; padding: 48px 20px; color: var(--ink3); }
  .empty b { display: block; color: var(--ink2); font-size: 15px; margin-bottom: 4px; }

  /* feedback */
  .loading { position: fixed; top: 0; left: 232px; right: 0; height: 3px; background: linear-gradient(90deg, var(--brand2) 0 40%, transparent 40%); background-size: 200% 100%; animation: load 1s linear infinite; display: none; z-index: 50; }
  .loading.on { display: block; }
  @keyframes load { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .toast { position: fixed; bottom: 22px; right: 22px; background: #1f2933; color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    max-width: 440px; font-size: 13px; opacity: 0; transform: translateY(10px); transition: all .2s; pointer-events: none; z-index: 60; }
  .toast.on { opacity: 1; transform: none; }
  .toast.err { background: var(--a); }
  .skeleton { height: 90px; border-radius: var(--radius); background: linear-gradient(90deg, #eef1f4, #f7f8fa, #eef1f4); background-size: 200% 100%; animation: load 1.2s linear infinite; }
  .help { background: var(--brand-soft); border-radius: 8px; padding: 10px 14px; color: var(--brand); font-size: 13px; margin-bottom: 14px; }
  .log td { font-size: 12px; }
  .weeks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-bottom: 16px; }
  .wkbtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 4px; text-align: center; color: var(--ink); }
  .wkbtn b { display: block; font-size: 14px; }
  .wkbtn span { font-size: 11px; color: var(--ink3); }
  .wkbtn:hover { border-color: var(--brand2); }
  .wkbtn.on { background: var(--brand2); border-color: var(--brand2); color: #fff; }
  .wkbtn.on span { color: #dbe6f7; }
  .wkbtn.future { opacity: .5; }
  .wkbtn .now { display: inline-block; font-size: 10px; font-weight: 700; color: var(--brand2); }
  .wkbtn.on .now { color: #fff; }
  .report { padding: 28px 34px; }
  /* to-do */
  .todo { padding: 4px 0; }
  .task { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid #f0f2f4; cursor: pointer; }
  .task:last-child { border-bottom: 0; }
  .task:hover { background: #fafbfc; }
  .task .ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .task.question .ic { background: var(--warn-bg); color: var(--warn); }
  .task.load .ic { background: var(--a-bg); color: var(--a); }
  .task.followup .ic { background: var(--brand-soft); color: var(--brand2); }
  .task.excuse .ic { background: var(--e-bg); color: var(--e); }
  .task.populi .ic { background: #f0ebfa; color: #6b3fa0; }
  .task.mail .ic { background: #e6f4ff; color: #0b6bcb; }
  .task.mail.late .ic { background: var(--a-bg); color: var(--a); }
  .ml { padding: 16px 18px; margin-bottom: 12px; }
  .ml.closed { opacity: .75; }
  .ml .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ml .who { font-size: 16px; font-weight: 600; }
  .ml .subj { margin: 8px 0 2px; font-weight: 600; }
  .ml .sum { color: var(--ink2); }
  .ml .exc { background: var(--e-bg); color: var(--e); border-radius: 8px; padding: 8px 12px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ml textarea { width: 100%; box-sizing: border-box; min-height: 170px; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font: inherit; font-size: 13px; line-height: 1.5; background: #f9fafb; resize: vertical; }
  .ml .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .ml .rw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .ml .rw input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 200px; flex: 1; }
  .task b { font-weight: 600; }
  .alldone { padding: 22px; text-align: center; color: var(--p); font-weight: 600; }
  /* week tiles */
  .wtiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .wt { padding: 12px 14px; cursor: pointer; border-left: 4px solid var(--line); }
  .wt:hover { border-color: var(--brand2); }
  .wt.ok { border-left-color: var(--p); } .wt.missing { border-left-color: var(--a); } .wt.future { opacity: .55; }
  .wt b { display: block; } .wt .small { margin-top: 3px; }
  /* quick status buttons */
  .pick { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pick button { border: 0; background: #fff; width: 32px; height: 28px; font-weight: 700; font-size: 12px; color: #9aa5b1; }
  .pick button + button { border-left: 1px solid var(--line); }
  .pick button:hover { background: #f5f7fa; color: var(--ink); }
  .pick button.on.P { background: var(--p-bg); color: var(--p); } .pick button.on.T { background: var(--t-bg); color: var(--t); }
  .pick button.on.A { background: var(--a-bg); color: var(--a); } .pick button.on.E { background: var(--e-bg); color: var(--e); }
  .flag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; margin: 1px 3px 1px 0; background: #eef1f4; color: var(--ink2); white-space: nowrap; }
  .flag.a { background: var(--a-bg); color: var(--a); } .flag.e { background: var(--e-bg); color: var(--e); } .flag.w { background: var(--warn-bg); color: var(--warn); }
  .more { border: 0; background: transparent; width: 30px; height: 28px; border-radius: 6px; color: var(--ink2); font-size: 18px; line-height: 1; }
  .more:hover { background: #eef1f4; }
  .menu { position: fixed; z-index: 70; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 6px; min-width: 250px; display: none; }
  .menu.on { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; }
  .menu button:hover { background: #f5f7fa; }
  .menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  .menu .h { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink3); padding: 6px 10px 2px; }
  .actionbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .name-link { cursor: pointer; }
  .name-link:hover { color: var(--brand2); text-decoration: underline; }
  /* smaller screens (laptop, or the window over the sheet) */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 180px 1fr; }
    nav { padding: 14px 8px; }
    main { padding: 18px 18px 50px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .wtiles { grid-template-columns: repeat(3, 1fr); }
    .weeks { grid-template-columns: repeat(5, 1fr); }
    .loading { left: 180px; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; height: auto; }
    nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .nav-h, .nav-foot, .logo-sub, .nav-i small { display: none; }
    .nav-i { width: auto; }
    .wtiles, .weeks { grid-template-columns: repeat(2, 1fr); }
    .loading { left: 0; }
  }
  .dzs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .dz { padding: 18px; border: 2px dashed #cbd2d9; text-align: center; cursor: pointer; box-shadow: none; transition: all .15s; }
  .dz:hover, .dz.active { border-color: var(--brand2); background: var(--brand-soft); }
  .dz.over { border-color: var(--p); background: var(--p-bg); }
  .dz .dz-n { margin-top: 10px; }
  .changed { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 13px; }
  /* take attendance */
  .nav-cta { margin: 0 0 10px; background: #fff; color: var(--brand); font-weight: 700; justify-content: center; opacity: 1; }
  .nav-cta:hover { background: #eef3fb; }
  .nav-cta.on { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .kbd { display: inline-block; font-size: 11px; font-weight: 600; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink2); background: #fff; }
  .take { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
  .drop { border: 2px dashed #b9c4d0; border-radius: 14px; padding: 34px 20px; text-align: center; background: #fff; cursor: pointer; transition: all .15s; }
  .drop:hover, .drop.over { border-color: var(--brand2); background: var(--brand-soft); }
  .drop .big { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .lanes.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lanes.one { grid-template-columns: minmax(0, 1fr); }
  .lane { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 150px; }
  .lane.over { border-color: var(--brand2); background: var(--brand-soft); }
  .lane h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .lane .why { font-size: 12px; color: var(--ink3); margin: 2px 0 10px; }
  .lane.unsorted { border-color: #f5c26b; background: var(--warn-bg); }
  .thumb { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; background: #f9fafb; cursor: grab; }
  .thumb img { display: block; width: 100%; height: 92px; object-fit: cover; object-position: top; }
  .thumb .meta { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 12px; }
  .thumb .meta select { margin-left: auto; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; background: #fff; }
  .thumb .x { border: 0; background: transparent; color: var(--ink3); font-size: 15px; line-height: 1; padding: 0 2px; }
  .side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
  .side .card { padding: 16px; }
  .side label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin: 10px 0 4px; }
  .side input, .side select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; background: #fff; }
  .wbar { display: flex; gap: 3px; margin-top: 6px; }
  .wbar i { flex: 1; height: 6px; border-radius: 3px; background: #e3e7ec; }

<body>
<div class="app">

</div>
<div class="loading" id="loading"></div>
<div class="toast" id="toast"></div>
<div class="menu" id="menu"></div>

<script>
/* ---------- helpers ---------- */
var S = { view: 'home', classId: null, date: null, overview: null, filter: 'all', search: '', ocrTab: 'present', showNoise: false };
var LETTER_NAME = { P: 'Present', T: 'Tardy', A: 'Absent', E: 'Excused' };

  h += item('review', 'Names to confirm', o.openQuestions ? '<span class="badge alert">' + o.openQuestions + '</span>' : '', '');
  h += item('mail', 'Student emails', o.mailWaiting ? '<span class="badge alert">' + o.mailWaiting + '</span>' : '', '');
  h += item('reports', 'Weekly reports', '', '');

}

  var views = { home: viewHome, class: viewClass, session: viewSession, review: viewReview, followups: viewFollowups, activity: viewActivity, reports: viewReports,

/* Speed: every page shows its last copy at once (kept in this Mac's browser, so the dashboard opens instantly next time too),

  apiStudent: 1, apiMail: 1, apiShotFiles: 1, apiStanding: 1,

  cacheWrite(ckey('apiOverview'), a.overview);
  Object.keys(a.classes).forEach(function (id) { cacheWrite(ckey('apiClass', [id]), a.classes[id]); });
  cacheWrite(ckey('apiQuestions'), a.questions);
  cacheWrite(ckey('apiFollowups'), a.followups);
  cacheWrite(ckey('apiReportWeeks'), a.reportWeeks);
  cacheWrite(ckey('apiMail'), a.mail);

}

  return new Promise(function (ok) {
    google.script.run.withSuccessHandler(function (a) {
      var before = JSON.stringify(cacheRead(ckey('apiOverview'))) + JSON.stringify(cacheRead(ckey('apiMail'))) + JSON.stringify(cacheRead(ckey('apiStanding')));
      seedAll(a); renderNav();
      var typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
      var changed = before !== JSON.stringify(a.overview) + JSON.stringify(a.mail) + JSON.stringify(a.standing);
      if (redraw !== false && changed && !typing && /^(home|class|review|followups|mail|standing)$/.test(S.view)) { S.nav = (S.nav || 0) + 1; renderView(); }
      if (a && a.claudeWaiting) checkClaude();
      ok(a);
    }).withFailureHandler(function () { ok(null); }).apiAll();

}
/** Screenshots wait for Claude: take the attendance as soon as its results are in Drive (at most every 2 minutes). */
var CLAUDE_AT = 0;
function checkClaude() {
  if (Date.now() - CLAUDE_AT < 120000) return;

  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.lines || !r.lines.length) return;
    toast('Claude read the screenshots: ' + r.lines.map(function (x) { return String(x).split('. ')[0]; }).join(' · '));
    MEM = {}; storeClear(); loadAll(true);

function fresh(fn, args, draw) {

function refreshOverview() {

}

/* ---------- Take attendance: drop every screenshot of a class at once ---------- */
var LANES = {
  present: ['15 min', 'Seen here → Present'],
  tardy: ['31 min', 'First seen here → Tardy'],

function takeClass() { return classInfo(T.classId); }

/** 15-min shot before minute 22, 31-min shot before minute 45, the last one after that. */

function savedStart(classId, date) {

function setupDrops() {

    z.addEventListener('dragover', function (e) { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function () { z.classList.remove('over'); });
    z.addEventListener('drop', function (e) {
      e.preventDefault(); z.classList.remove('over');
      S.activePhase = z.getAttribute('data-phase');
      uploadShots(S.activePhase, Array.prototype.slice.call(e.dataTransfer.files));
    });
    z.addEventListener('click', function (e) {
      if (e.target.closest('[data-act]')) return;
      S.activePhase = z.getAttribute('data-phase');
      document.querySelectorAll('.dz').forEach(function (x) { x.classList.toggle('active', x === z); });
      $('shotInput').click();
    });
  });
  var input = $('shotInput');
  if (input) input.onchange = function () { uploadShots(S.activePhase || 'present', Array.prototype.slice.call(input.files)); input.value = ''; };
}
document.addEventListener('paste', function (e) {
  if (S.view !== 'session' || !S.sess || !S.sess.zoom) return;
  var files = Array.prototype.slice.call((e.clipboardData || {}).files || []);
  if (files.length) uploadShots(S.activePhase || 'present', files);
});
/** Shrinks a screenshot (keeps it sharp enough to read) so it uploads fast. → base64 JPEG */
function shrink(file) {
  return new Promise(function (ok, fail) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var w = Math.min(img.width, 2400), h = Math.round(img.height * w / img.width), c = document.createElement('canvas');
      c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    };
    img.onerror = function () { fail(new Error('Not an image: ' + file.name)); };
    img.src = url;
  });
}
function uploadShots(phase, files) {
  files = files.filter(function (f) { return /^image\//.test(f.type); });
  if (!files.length) { toast('Drop image files (PNG or JPG)', true); return; }
  var label = { present: '15 min', tardy: '31 min', end: 'last screenshot' }[phase], i = 0, names = 0, aiErr = '';
  var how = S.sess && S.sess.aiOn ? ' with AI' : '';
  var status = function (t) { var el = $('upStatus'); if (el) el.textContent = t; };
  var done = 0, failed = false, subs = null, got = [];
  // Four at a time, without the script lock: each one is saved and read; the analysis then registers them all at once.
  var worker = function () {
    if (i >= files.length || failed) return Promise.resolve();
    var k = i++, f = files[k];
    return shrink(f).then(function (b64) {
      return call('apiUploadShot', S.classId, S.date, phase, f.name.replace(/\.\w+$/, '') + '.jpg', 'image/jpeg', b64, subs ? subs[phase] || '' : '');
    }).then(function (r) {
      names += r.names; if (r.aiError) aiErr = r.aiError;
      if (r.fileId) got[k] = { phase: r.phase, fileId: r.fileId, text: r.text, ai: r.ai };
      status('Read ' + (++done) + ' of ' + files.length + ' ' + label + ' screenshot' + (files.length === 1 ? '' : 's') + how + '…');
      return worker();
    }, function (e) { failed = true; throw e; });
  };
  status('Reading ' + files.length + ' ' + label + ' screenshot' + (files.length === 1 ? '' : 's') + how + '…');
  call('apiPrepareShots', S.classId, S.date).then(function (p) {
    subs = p && p.subs;
    var pool = [];
    for (var w = 0; w < Math.min(4, files.length); w++) pool.push(worker());
    return Promise.all(pool);
  }).then(function () {
    status('Analyzing the class with all the screenshots…');
    return call('apiAnalyzeSession', S.classId, S.date, got.filter(Boolean)).then(function (r) {
      status(''); toast(r.waiting ? r.msg : 'Done: ' + String(r.msg).split('. ')[0] + (aiErr ? '. AI could not read some (' + aiErr + '); the OCR was used' : ''), !!aiErr);
      MEM = {}; storeClear();
      viewSession();
    });
  }).catch(function () {
    // keep the ones already saved (registered without taking the attendance yet)
    if (got.some(Boolean)) call('apiAnalyzeSession', S.classId, S.date, got.filter(Boolean), true).catch(function () {});
    status('Stopped. The screenshots read so far are saved; drop the rest again.');
  });
}
/** Read with AI the screenshots that were only read with OCR, then analyze the class again. */
function readAi() {
  var status = function (t) { var el = $('upStatus'); if (el) el.textContent = t; };
  status('Looking for screenshots…');
  call('apiShotFiles', S.classId, S.date).then(function (f) {
    var todo = [];
    ['present', 'tardy', 'end'].forEach(function (p) { f[p].forEach(function (x) { if (!x.done) todo.push({ p: p, x: x }); }); });
    var i = 0, done = 0;
    var worker = function () {
      if (i >= todo.length) return Promise.resolve();
      var t = todo[i++];
      return call('apiAiReadFile', S.classId, S.date, t.p, t.x.index, t.x.id).then(function () {
        status('Read ' + (++done) + ' of ' + todo.length + ' screenshots with AI…');
        return worker();
      });
    };
    status('Reading ' + todo.length + ' screenshots with AI…');
    return Promise.all([worker(), worker(), worker()]).then(function () {
      status('Analyzing the class…');
      return call('apiAnalyzeSession', S.classId, S.date).then(function (r) {
        status(''); toast(r.waiting ? r.msg : 'Done: ' + String(r.msg).split('. ')[0]);
        MEM = {}; storeClear();
        viewSession();
      });
    });
  }).catch(function () { status('Stopped. Try again: the screenshots already read are kept.'); });
}

    return '<button class="' + x + (k === x ? ' on' : '') + '" title="' + LETTER_NAME[x] + '" data-act="rec" data-sid="' + esc(sid) + '" data-date="' + esc(date) +
      '" data-change=\'' + JSON.stringify({ status: LETTER_NAME[x] }) + '\'>' + x + '</button>';

function flags(s) {
  var f = '';
  if (s.left) f += '<span class="flag a">Left early</span>';
  if (s.noId) f += '<span class="flag w">No ID</span>';
  if (/^received$/i.test(s.excuse || '')) f += '<span class="flag e">Excuse received</span>';
  if (/^accepted$/i.test(s.excuse || '')) f += '<span class="flag e">Excuse accepted</span>';
  if (/^rejected$/i.test(s.excuse || '')) f += '<span class="flag a">Excuse rejected</span>';

function findStudentRec(sid, date) {
  if (S.view === 'session' && S.sess) return S.sess.students.filter(function (x) { return x.id === sid; })[0];
  if (S.view === 'student' && S.stu) { var w = S.stu.weeks.filter(function (x) { return x.date === date; })[0]; return w && w.rec ? w.rec : {}; }
  return null;
}

function ocrPanel(d) {
  if (!d.ocr) {
    return '<div class="tabs"><button class="on">What the screenshots said</button></div><div class="empty"><b>No screenshot text for this class</b>' +
      (d.ocrError ? esc(d.ocrError) : 'This class came from a Populi export or a Zoom report.') + '</div>';
  }
  var names = { present: '15 min', tardy: '31 min', end: 'Last screenshot' };
  var h = '<div class="tabs">' + ['present', 'tardy', 'end'].map(function (p) {
    var n = (d.ocr.phases[p] || []).length;
    return '<button class="' + (S.ocrTab === p ? 'on' : '') + '" data-act="ocrTab" data-p="' + p + '">' + names[p] + ' <span class="muted">(' + n + ')</span></button>';
  }).join('') + '<div class="spacer"></div><label class="small muted" style="align-self:center"><input type="checkbox" data-act="noise"' + (S.showNoise ? ' checked' : '') + '> show every line</label></div>';
  var shots = d.ocr.phases[S.ocrTab] || [];
  if (!shots.length) return h + '<div class="empty"><b>No screenshots in this folder</b>Put them in the "' + names[S.ocrTab] + '" folder.</div>';
  var icons = { match: '✓', doubt: '?', unknown: '✕', ignored: '–', noise: '·' };
  // A doubt only becomes a question when one of the possible students was not recognized anyway.
  var asked = {};
  (d.questions || []).forEach(function (q) { asked[String(q['Name seen']).toLowerCase()] = true; });
  shots.forEach(function (lines, i) {
    var m = lines.filter(function (l) { return l.result === 'match'; }).length;
    var u = lines.filter(function (l) { return l.result === 'unknown' || l.result === 'doubt'; }).length;
    h += '<div class="shot"><div class="shot-h"><span>Screenshot ' + (i + 1) + '</span><span>' + m + ' recognized' + (u ? ' · <span style="color:var(--warn)">' + u + ' to check</span>' : '') + '</span></div>';
    lines.filter(function (l) { return S.showNoise || l.result !== 'noise'; }).forEach(function (l) {
      var extra = l.kind === 'chat' ? '<span class="kind">chat ' + esc(l.time) + (l.minute != null ? ' · min ' + l.minute : '') + '</span>' : '<span class="kind">video</span>';
      var who = l.result === 'match' ? esc(l.who) + (l.how === 'similar' ? ' <span class="chip warn">similar</span>' : '') :
        l.result === 'doubt' ? (asked[firstName(l.text)] ? '<span style="color:var(--warn)">Could be ' + esc(l.who) + '</span>'
          : '<span class="muted">Could be ' + esc(l.who) + ' — all of them already recognized</span>') :
        l.result === 'unknown' ? '<span style="color:var(--a)">Not on the roster</span>' : l.result === 'ignored' ? 'ignored' : '';
      var cls = l.result === 'doubt' && !asked[firstName(l.text)] ? 'ignored' : l.result;
      h += '<div class="line ' + cls + '"><span class="ico">' + (cls === 'ignored' && l.result === 'doubt' ? '✓' : icons[l.result]) + '</span><span>' + extra + esc(l.text) + '</span><span class="who">' + who + '</span></div>';
    });
    h += '</div>';
  });
  if (d.folderUrl) h += '<div class="pad small"><a href="' + esc(d.folderUrl) + '" target="_blank">Open the screenshots in Drive</a></div>';
  return h;
}

function firstName(text) { return String(text).split(' ← ')[0].toLowerCase(); }

  return '<div class="card q" data-row="' + q.row + '"><div class="row"><div><div class="seen">"' + esc(q['Name seen']) + '"</div>' +
    '<div class="small muted">' + esc(q.classLabel || q['Class ID']) + ' · ' + esc(shortDate(q.Date)) + ' · seen in: ' + esc(q['Seen in']) + '</div></div></div>' +
    (q.Notes ? '<div class="small" style="color:var(--a);margin-top:6px">' + esc(q.Notes) + '</div>' : '') +
    '<div class="opts">' + (sugg.length ? '<span class="small muted">Is it</span>' + sugg.map(function (s) {
      return '<button class="btn sm" data-act="answer" data-row="' + q.row + '" data-ans="' + esc(s.split(' ')[0]) + '">' + esc(s) + '</button>';
    }).join('') : '<span class="small muted">No similar name on the roster.</span>') +
    '<button class="btn sm" data-act="answer" data-row="' + q.row + '" data-ans="new" title="Added to the class after it started: adds them at the end of the roster, from this date">+ New student</button>' +

    '<button class="btn sm ghost" data-act="answer" data-row="' + q.row + '" data-ans="ignore">Not a student</button></div></div>';
}

  takeCls: function (b) {
    var c = classInfo(b.getAttribute('data-c')), w = nextWeek(c);
    T.picked = true; setTakeClass(c.id, w ? w.date : ymd(new Date())); drawTake();
  },
  takeWeek: function (b) { T.picked = true; setTakeClass(T.classId, b.getAttribute('data-d')); drawTake(); },
  takeOtherDate: function () { T.otherDate = true; drawTake(); },
  takePick: function (b) {
    var c = classInfo(b.getAttribute('data-c')), d = b.getAttribute('data-d');
    T.picked = true; setTakeClass(c.id, d);
    if (S.view === 'take') drawTake(); else go('take');
  },
  takeGo: function () { takeSubmit(); },
  takeClear: function () { T.files.forEach(function (x) { URL.revokeObjectURL(x.url); }); T.files = []; T.picked = false; T.detected = false; T.msg = ''; drawTake(); },
  takeRemove: function (b) {
    var id = b.getAttribute('data-id');
    T.files = T.files.filter(function (x) { if (x.id === id) URL.revokeObjectURL(x.url); return x.id !== id; });
    drawTake();
  },
  takeLane: function () { /* handled on change */ },
  standFilter: function (b) { S.standFilter = b.getAttribute('data-f'); drawStanding(); },
  standSent: function (b) {
    var classId = b.getAttribute('data-c'), ids = b.getAttribute('data-ids').split(',');
    var card = b.closest('.msg'); if (card) card.classList.add('sent');
    b.disabled = true; b.textContent = 'Saving…';
    call('apiStandingSent', classId, ids).then(function (d) {
      S.standing = d; cacheWrite(ckey('apiStanding'), d); renderNav(); if (S.view === 'standing') drawStanding();
      toast('Marked as sent. It comes back here if their numbers change.');
    }, function () { if (card) card.classList.remove('sent'); b.disabled = false; b.textContent = 'Mark as sent'; });
  },
  process: function (b) {
    b.disabled = true; b.textContent = 'Processing…';
    call('apiProcessNow').then(function (r) {
      toast(r.busy ? 'Already running in the background. Try again in a minute.' :
        (r.files ? r.files + ' file(s) read. ' : 'No new files. ') + (r.sent ? r.sent + ' follow-up(s) ready.' : ''));
      render();
    }, function () { b.disabled = false; b.textContent = 'Process inbox now'; });
  },
  filter: function (b) { S.filter = b.getAttribute('data-f'); document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x === b); }); drawClassTable(); },
  readAi: function () { readAi(); },
  mailFilter: function (b) { S.mailFilter = b.getAttribute('data-f'); viewMail(); },
  mailShow: function (b) { S.mailOpen = mailOf(b).id; viewMail(); },
  mailCheck: function (b) {
    b.disabled = true; b.textContent = 'Checking…';
    call('apiCheckMail').then(function (r) { toast(r.changed ? r.changed + ' email(s) updated' : 'No new student emails'); STAMP = {}; refreshOverview(); viewMail(); },
      function () { b.disabled = false; b.textContent = 'Check now'; });
  },
  mailCopy: function (b) { copy(mailOf(b).card.querySelector('textarea').value, 'Reply'); },
  mailGmail: function (b) {
    var x = mailOf(b), text = x.card.querySelector('textarea').value;
    b.disabled = true;
    call('apiMailToGmail', x.id, text).then(function () { b.disabled = false; mailSet(x.id, { draft: text }); toast('Draft saved in Gmail, in the same conversation. Review it and press Send there.'); },
      function () { b.disabled = false; });
  },
  mailStatus: function (b) {
    var x = mailOf(b), st = b.getAttribute('data-s');
    mailSet(x.id, { status: st }); S.mailOpen = null; viewMail();
    call('apiMailStatus', x.id, st).then(function () { toast(st === 'Needs reply' ? 'Moved back to Needs reply' : 'Marked: ' + st); });
  },
  mailRewrite: function (b) {
    var x = mailOf(b), i = b.getAttribute('data-i'), ta = x.card.querySelector('textarea');
    var how = i != null ? REWRITES[+i][1] : x.card.querySelector('.rwIn').value.trim();
    if (!how) { toast('Write what the reply should say', true); return; }
    ta.style.opacity = .5; b.disabled = true;
    call('apiMailRedraft', x.id, how).then(function (r) { ta.value = r.draft; ta.style.opacity = 1; b.disabled = false; mailSet(x.id, { draft: r.draft }); },
      function () { ta.style.opacity = 1; b.disabled = false; });
  },
  mailForward: function (b) {
    var x = mailOf(b);
    b.disabled = true;
    call('apiMailForwardExcuse', x.id).then(function (r) { toast('Draft to ' + r.to + ' saved in Gmail (with the attachments). Review it and send.'); }, function () { b.disabled = false; });
  },
  ocrTab: function (b) { S.ocrTab = b.getAttribute('data-p'); $('ocrCard').innerHTML = ocrPanel(S.sess); },
  noise: function (b) { S.showNoise = b.checked; $('ocrCard').innerHTML = ocrPanel(S.sess); },
  saveStart: function () {
    var v = $('startIn').value;
    call('apiSetStart', S.classId, S.date, v).then(function () { toast('Start time saved. The class was re-checked.'); refreshOverview(); viewSession(); });
  },
  answer: function (b) { answer(b.getAttribute('data-row'), b.getAttribute('data-ans'), b); },
  answerInput: function (b) {
    var row = b.getAttribute('data-row'), v = $('ans' + row).value.trim();
    if (!v) { toast('Type the # or the name first', true); return; }
    answer(row, v, b);
  },
  fuDone: function (b) {
    b.disabled = true;
    call('apiFollowupDone', +b.getAttribute('data-row')).then(function () { toast('Marked as sent'); refreshOverview(); viewFollowups(); });
  },
  copy: function (b) { copy(b.getAttribute('data-text'), b.getAttribute('data-what')); },
  menu: function (b) { openMenu(b); },
  clearShots: function (b) {
    var p = b.getAttribute('data-phase');
    if (!confirm('Remove the screenshots of this moment? You can drop them again.')) return;
    call('apiClearShots', S.classId, S.date, p).then(function () { toast('Removed. Drop the right screenshots, then it re-checks.'); viewSession(); });
  },
  rec: function (b) {
    $('menu').classList.remove('on');
    setRec(b.getAttribute('data-sid'), b.getAttribute('data-date'), JSON.parse(b.getAttribute('data-change')));
  },
  bulk: function (b) {
    var st = b.getAttribute('data-s');
    call('apiBulkStatus', S.classId, S.date, st).then(function (r) { toast(r.changed + ' student(s) marked ' + st); viewSession(); });
  },
  finish: function (b) {
    var none = S.sess.students.filter(function (s) { return !letterOf(s); }).length;
    if (none && !confirm(none + ' student(s) still have no status. They will count as absent if the class is closed. Continue?')) return;
    b.disabled = true; b.textContent = 'Preparing…';
    call('apiFinishSession', S.classId, S.date).then(function (r) {
      toast(r.busy ? 'Busy, try again in a minute.' : (r.sent ? r.sent + ' follow-up(s) ready in Follow-ups.' : 'Saved. No new follow-ups.'));
      refreshOverview(); viewSession();
    }, function () { b.disabled = false; b.textContent = 'Done — prepare follow-ups'; });
  },
  populi: function (b) {
    var v = !!b.getAttribute('data-v');
    call('apiPopuliDone', S.classId, S.date, v).then(function () { toast(v ? 'Marked as done in Populi' : 'Unmarked'); refreshOverview(); viewSession(); });
  },
  pickWeek: function (b) {
    S.reportWeek = +b.getAttribute('data-w');
    document.querySelectorAll('.wkbtn').forEach(function (x) { x.classList.toggle('on', x === b); });
    loadReport();
  },
  reportSend: function (b) {
    b.disabled = true;
    call('apiSendWeeklyReport', S.reportWeek).then(function (r) { b.disabled = false; toast('Week ' + S.reportWeek + ' report sent to ' + r.to); },
      function () { b.disabled = false; });
  },
  reportPdf: function (b) {
    b.disabled = true; b.textContent = 'Saving…';
    call('apiSaveWeeklyReportPdf', S.reportWeek).then(function (r) {
      b.disabled = false; b.textContent = 'Save as PDF in Drive';
      toast('Saved in Drive → TA Reports');
      window.open(r.url, '_blank');
    }, function () { b.disabled = false; b.textContent = 'Save as PDF in Drive'; });
  }
};
/** Change one student's record: shown at once, saved in the background, undone if saving fails. */
function setRec(sid, date, change) {
  var s0 = S.view === 'session' ? S.sess.students.filter(function (x) { return x.id === sid; })[0] : null, before = s0 ? JSON.stringify(s0) : '';
  if (s0) {
    if (change.status) { s0.status = change.status; if (change.status !== 'Absent') s0.left = false; }
    if (change.leftEarly !== undefined) { s0.left = change.leftEarly; if (change.leftEarly) s0.status = 'Absent'; }
    if (change.noId !== undefined) s0.noId = change.noId;
    if (change.excuse !== undefined) s0.excuse = change.excuse;
    if (change.office === 'Present') { s0.status = 'Present'; s0.left = false; }
    drawSession();
  }
  call('apiSetRecord', S.classId, date, sid, change).catch(function () {
    if (s0) { Object.assign(s0, JSON.parse(before)); drawSession(); }
  }).then(function (r) {
    if (!r) return;
    if (S.view === 'session') {
      var s = S.sess.students.filter(function (x) { return x.id === sid; })[0];
      Object.assign(s, { status: r.status, left: r.left, noId: r.noId, excuse: r.excuse, notes: r.notes });
      cacheWrite(ckey('apiSession', [S.classId, S.date]), S.sess);
      drawSession();
    } else if (S.view === 'student') { viewStudent(); }
    toast('Saved · now ' + r.effective + ' counted absence' + (r.effective === 1 ? '' : 's') + ', ' + r.pct + '% (' + r.stateLabel + ')');
  });
}
function answer(row, ans, b) {
  var card = b.closest('.q'); if (card) card.style.opacity = .5;
  call('apiAnswer', +row, ans).then(function (r) {
    if (r && r.note && /^Not found/.test(r.note)) { toast(r.note, true); if (card) card.style.opacity = 1; return; }
    toast(r && r.note ? r.note.split(' · ')[0] : 'Saved');
    refreshOverview(); render();
  }, function () { if (card) card.style.opacity = 1; });
}

/* Desktop: keyboard shortcuts, drop or paste screenshots anywhere. */
document.addEventListener('change', function (e) {
  var sel = e.target.closest('[data-act="takeLane"]');
  if (sel) moveShot(sel.getAttribute('data-id'), sel.value);
});
document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.activeElement, tag = a && a.tagName;
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) { if (e.key === 'Escape') a.blur(); return; }
  var k = e.key;
  if (k === 'Escape') { $('menu').classList.remove('on'); var f = $('finder'); if (f) f.classList.remove('on'); return; }
  if (S.view === 'session' && S.sess) {
    var n = S.sess.students.length;
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      e.preventDefault();
      S.focusRow = S.focusRow == null ? 0 : Math.max(0, Math.min(n - 1, S.focusRow + (k === 'ArrowDown' ? 1 : -1)));
      drawSession();
      var tr = document.querySelector('#sessTable tr.focus'); if (tr) tr.scrollIntoView({ block: 'nearest' });
      return;
    }
    var letter = k.toUpperCase();
    if (S.focusRow != null && LETTER_NAME[letter] && k.length === 1) {
      var st = S.sess.students[S.focusRow];
      if (st) { setRec(st.id, S.sess.date, { status: LETTER_NAME[letter] }); if (S.focusRow < n - 1) S.focusRow++; }
      return;
    }
  }
  if (k === 'n' || k === 'N') go('take');
  else if (k === 'f' || k === 'F') go('standing');
  else if (k === 'h' || k === 'H') go('home');
  else if (k === '/') { e.preventDefault(); openFinder(); }
});
document.addEventListener('click', function (e) {
  var tr = e.target.closest('#sessTable tr[data-i]');
  if (tr && !e.target.closest('button,[data-go]') && S.view === 'session') { S.focusRow = +tr.getAttribute('data-i'); drawSession(); }
  var f = $('finder');
  if (f && f.classList.contains('on') && !e.target.closest('#finder')) f.classList.remove('on');
  if (f && e.target.closest('#finder [data-go]')) f.classList.remove('on');
});
document.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); var d = $('drop'); if (d) d.classList.add('over'); } });
document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) { var d = $('drop'); if (d) d.classList.remove('over'); } });
document.addEventListener('drop', function (e) {
  if (e.target.closest && e.target.closest('.dz')) return; // the session's own drop zones
  var files = Array.prototype.slice.call((e.dataTransfer || {}).files || []);
  if (!files.length) return;
  e.preventDefault();
  addShots(files);
});
document.addEventListener('paste', function (e) {
  if (S.view === 'session') return; // the session view takes it in its own zone
  var a = document.activeElement;
  if (a && /INPUT|TEXTAREA/.test(a.tagName)) return;
  var files = Array.prototype.slice.call((e.clipboardData || {}).files || []);
  if (files.length) addShots(files, true);
});

(function start() {
  var cached = cacheRead(ckey('apiOverview'));
  if (cached) { S.overview = cached; render(); loadAll(); }
  else { busy(true); loadAll(false).then(function () { busy(false); render(); }); }
})();
</script>
